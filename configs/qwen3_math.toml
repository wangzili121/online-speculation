[models]
base = "models/Qwen3-1.7B"
base_source = "Qwen/Qwen3-1.7B"
base_revision = "70d244cc86ccca08cf5af4e1e306ecf908b1ad5e"

[model_loading]
local_files_only = true
trust_remote_code = false
attn_implementation = "sdpa"

[runtime]
backend = "transformers"
device = "cuda"
dtype = "bfloat16"
max_score_batch_size = 1
score_chunk_size = 256

[generation]
max_new_tokens = 32768

[sampling]
temperature = 0.6

[output]
sampling_scope = "full"
thinking_mode = "enabled"
thinking_format = "auto"

[reward]
source = "consilience"
temperature = 2.0

[reward.consilience]
scope = "thinking"
top_k = 5
window_fraction = 0.2
skip_fraction = 0.05
initial_penalty = 3.0
score_temperature = 1.0

[comparison]
self_consistency_temperature = 0.25
sequence_log_probability_temperature = 10.0
consilience_temperature = 2.0

[benchmark]
subset_seed = 20260911
minimum_level = 5
development_count = 8
test_count = 64
# 模型与格式开发检查已使用的题目，排除于后续分层抽样。
excluded_ids = [
  "test/prealgebra/954.json", "test/precalculus/1133.json",
  "test/algebra/1082.json", "test/counting_and_probability/913.json",
  "test/precalculus/1291.json", "test/intermediate_algebra/1210.json",
  "test/number_theory/847.json", "test/intermediate_algebra/1555.json",
]
