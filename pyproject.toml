[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-scaling"
version = "0.1.0"
description = "Theory-aligned inference scaling for autoregressive and diffusion language models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "packaging>=24,<27",
]

[project.optional-dependencies]
evaluation = [
  "math-verify[antlr4_13_2]==0.9.0",
]
dev = [
  "mypy>=1.20,<2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
]
gpu = [
  "accelerate>=1.14,<2",
  "safetensors>=0.8,<1",
  "transformers>=5.14,<6",
]
dllm = [
  "accelerate>=1.7,<2",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.4.3,<1",
  "transformers==4.53.2",
]
vllm = [
  "safetensors>=0.8,<1",
  "torch==2.11.0",
  "transformers>=5.14,<6",
  "vllm>=0.25,<0.27",
]
training = [
  "datasets==5.0.1",
  "modelscope==1.39.1",
  "peft==0.20.0",
  "pyarrow==25.0.0",
  "trl==1.9.2",
]
dllm-training = [
  "peft==0.20.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B023"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
