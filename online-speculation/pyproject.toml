[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "online-speculation"
version = "0.4.0"
description = "Shared-backbone bidirectional drafting, exact correction, and online suffix continuation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]
hf = ["transformers>=4.55"]
text = ["tokenizers>=0.21"]
data = ["requests>=2.32", "transformers>=4.55", "tokenizers>=0.21"]

[project.scripts]
blockspec = "blockspec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B023"]
