[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blockspec-ablation"
version = "0.4.0"
description = "Optional comparison implementations for shared-backbone speculative decoding."
requires-python = ">=3.10"
dependencies = ["online-speculation>=0.4.0"]

[project.scripts]
blockspec-ablation = "blockspec_ablation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["../src", "src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B023"]
